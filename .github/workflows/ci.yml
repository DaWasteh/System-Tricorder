name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*.*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_DEFAULT: "3.12"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint (Ruff + Pyflakes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install lint tools
        run: python -m pip install --upgrade pip ruff pyflakes
      - name: Ruff
        run: >-
          ruff check system_tricorder.py tests
          --select E,W,F,I,UP,B,SIM
          --ignore E501,E402,E701,E741,UP006,UP035,UP045,I001
          --output-format github
      - name: Pyflakes
        run: python -m pyflakes system_tricorder.py tests

  typecheck:
    name: Type check (Pyright)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Pyright and stubs
        run: |
          python -m pip install pyright psutil
          python -m pip install types-pywin32 || true
      - name: Create Pyright configuration
        run: |
          cat > pyrightconfig.json <<'EOF'
          {
            "include": ["system_tricorder.py"],
            "pythonVersion": "3.10",
            "typeCheckingMode": "basic",
            "reportMissingModuleSource": "none",
            "reportMissingImports": "warning",
            "reportGeneralTypeIssues": "warning",
            "ignore": ["**/win32com/**", "**/pythoncom*"]
          }
          EOF
      - name: Run Pyright
        run: pyright system_tricorder.py
        continue-on-error: true

  test-native:
    name: Test (${{ matrix.name }} / Python ${{ matrix.python }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            python: "3.10"
          - name: Windows
            runner: windows-latest
            python: "3.11"
          - name: Windows
            runner: windows-latest
            python: "3.12"
          - name: Windows
            runner: windows-latest
            python: "3.13"
          - name: Ubuntu
            runner: ubuntu-latest
            python: "3.12"
          - name: macOS
            runner: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          # Intentionally uncached: Windows cache cleanup has failed while
          # creating cache.tzst even after successful tests.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_smoke.py -v --tb=short

  test-linux-distros:
    name: Test/build (${{ matrix.name }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora
            slug: fedora
            image: fedora:latest
          - name: Arch Linux
            slug: arch
            image: archlinux:latest
          - name: Linux Mint
            slug: mint
            image: linuxmintd/mint22.3-amd64:latest
          - name: CachyOS
            slug: cachyos
            image: cachyos/cachyos:latest
          - name: Kali Linux
            slug: kali
            image: kalilinux/kali-rolling:latest
          - name: Debian
            slug: debian
            image: debian:bookworm-slim
    steps:
      - uses: actions/checkout@v5
      - name: Test inside ${{ matrix.image }}
        env:
          DISTRO_IMAGE: ${{ matrix.image }}
          BUILD_PACKAGE: ${{ github.event_name == 'push' && '1' || '0' }}
          BUILD_SLUG: ${{ matrix.slug }}
        run: |
          docker run --rm \
            -e QT_QPA_PLATFORM=offscreen \
            -e BUILD_PACKAGE \
            -e BUILD_SLUG \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$DISTRO_IMAGE" \
            bash .github/scripts/test_linux_distro.sh
      - name: Restore workspace ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - name: Upload ${{ matrix.name }} package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.slug }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  build-native:
    name: Build (${{ matrix.name }})
    if: github.event_name == 'push'
    needs: test-native
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            slug: windows
          - name: Ubuntu
            runner: ubuntu-latest
            slug: ubuntu
          - name: macOS
            runner: macos-latest
            slug: macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build native package
        run: python .github/scripts/build_release.py --slug "${{ matrix.slug }}"
      - name: Upload ${{ matrix.name }} package
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.slug }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-native, test-linux-distros]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: System Tricorder ${{ steps.version.outputs.VERSION }}
          body: |
            ## System Tricorder ${{ steps.version.outputs.VERSION }}

            Native packages are attached for Windows, macOS, Ubuntu, Fedora,
            Arch Linux, Linux Mint, CachyOS, Kali Linux, and Debian.

            Extract `.tar.gz` packages before launching `SystemTricorder`.
            macOS may require right-click → Open for an unsigned download.
          files: release/*
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
